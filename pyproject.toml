[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "temptf"
version = "0.1.0"
description = "Python client for the temp.tf disposable email API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "Liaksol" },
]
keywords = ["tempmail", "disposable-email", "temp-tf", "inbox", "api-client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/patrikdzejn88-ux/temptf"
PyPI = "https://pypi.org/project/temptf/"
Repository = "https://github.com/patrikdzejn88-ux/temptf"
Issues = "https://github.com/patrikdzejn88-ux/temptf/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.3.0",
    "mypy>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/temptf"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
